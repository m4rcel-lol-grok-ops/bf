<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Byteforge</title>
    <meta name="description" content="A universal toolkit for files, code, documents, feeds and sound." />
    <meta property="og:title" content="Byteforge" />
    <meta property="og:description" content="A universal toolkit for files, code, documents, feeds and sound." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
@import "tailwindcss";
@theme {
  --color-bg: var(--bg);
  --color-surface: var(--surface);
  --color-surface-alt: var(--surface-alt);
  --color-fg: var(--fg);
  --color-muted: var(--muted);
  --color-muted-dark: var(--muted-dark);
  --color-muted-light: var(--muted-light);
  --color-muted-alt: var(--muted-alt);
  --color-primary: var(--primary);
  --color-primary-fg: var(--primary-fg);
  --color-border: var(--border);
  --color-border-hover: var(--border-hover);
  --color-hover: var(--hover);
  --color-active: var(--active);
  --font-sans: "Inter", "San Francisco", "Helvetica Neue", sans-serif;
}
@layer base {
  :root {
    --bg: #050505;
    --surface: #0a0a0a;
    --surface-alt: #111111;
    --fg: #e5e5e5;
    --muted: #888888;
    --muted-dark: #555555;
    --muted-alt: #444444;
    --muted-light: #aaaaaa;
    --primary: #ffffff;
    --primary-fg: #000000;
    --border: #1a1a1a;
    --border-hover: #333333;
    --hover: #111111;
    --active: #1a1a1a;
  }
  :root.light {
    --bg: #ffffff;
    --surface: #f9f9f9;
    --surface-alt: #f0f0f0;
    --fg: #111111;
    --muted: #666666;
    --muted-dark: #aaaaaa;
    --muted-alt: #cccccc;
    --muted-light: #555555;
    --primary: #000000;
    --primary-fg: #ffffff;
    --border: #e0e0e0;
    --border-hover: #cccccc;
    --hover: #eeeeee;
    --active: #dddddd;
  }
  body {
    background-color: var(--bg);
    color: var(--fg);
  }
}
@layer utilities {
  .page-transition-enter { opacity: 0; transform: translateY(10px); }
  .page-transition-enter-active { opacity: 1; transform: translateY(0); transition: opacity 300ms ease, transform 300ms ease; }
  @media (prefers-reduced-motion: reduce) {
    .page-transition-enter-active { transition: opacity 300ms ease; transform: none; }
    .page-transition-enter { transform: none; }
  }
  .nav-item.active { color: var(--fg); }
}

  </style>
  </head>
  <body class="bg-bg text-fg font-sans antialiased selection:bg-primary selection:text-primary-fg">
    <div id="app" class="flex h-screen w-full overflow-hidden">
      <!-- Sidebar -->
      <nav id="sidebar" class="w-20 md:w-24 border-r border-border bg-bg flex flex-col items-center py-6 gap-6 transition-all z-20 flex-shrink-0">
        <a href="/" class="brand w-12 h-12 flex items-center justify-center rounded-2xl bg-primary text-primary-fg font-bold text-xl mb-4" title="Byteforge">B</a>
        
        <div class="flex-1 flex flex-col items-center gap-2 w-full px-2" id="nav-links">
          <!-- Populated by JS -->
        </div>

        <div class="mt-auto flex flex-col items-center gap-2 w-full px-2">
          <button id="theme-toggle" class="nav-item group w-full flex flex-col items-center justify-center p-2 text-muted hover:text-fg transition-colors" title="Toggle Theme">
            <div class="icon-wrapper w-10 h-10 flex items-center justify-center rounded-xl transition-colors group-hover:bg-hover">
              <i data-lucide="sun" class="w-5 h-5 theme-icon-light hidden"></i>
              <i data-lucide="moon" class="w-5 h-5 theme-icon-dark"></i>
            </div>
            <span class="text-[10px] font-medium mt-1">Theme</span>
          </button>
          <a href="/settings" class="nav-item group w-full flex flex-col items-center justify-center p-2 text-muted hover:text-fg transition-colors" data-path="/settings">
            <div class="icon-wrapper w-10 h-10 flex items-center justify-center rounded-xl transition-colors group-hover:bg-hover">
              <i data-lucide="settings" class="w-5 h-5"></i>
            </div>
            <span class="text-[10px] font-medium mt-1">Settings</span>
          </a>
        </div>
      </nav>

      <!-- Main Content -->
      <main id="main-content" class="flex-1 overflow-y-auto relative bg-bg">
        <!-- Rendered pages go here -->
      </main>

      <!-- Command Palette -->
      <div id="cmd-palette-backdrop" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity">
        <div id="cmd-palette" class="absolute top-1/4 left-1/2 -translate-x-1/2 w-full max-w-lg bg-surface border border-border rounded-2xl shadow-2xl flex flex-col overflow-hidden transform scale-95 transition-transform">
          <div class="p-4 border-b border-border flex items-center gap-3">
            <i data-lucide="search" class="w-5 h-5 text-muted"></i>
            <input type="text" id="cmd-input" class="flex-1 bg-transparent border-none outline-none text-fg text-lg placeholder:text-muted" placeholder="Jump to..." autocomplete="off" spellcheck="false" />
            <kbd class="hidden sm:inline-block px-2 py-1 text-xs font-mono bg-hover text-muted rounded">ESC</kbd>
          </div>
          <div id="cmd-results" class="max-h-64 overflow-y-auto p-2">
            <!-- Results -->
          </div>
        </div>
      </div>
      
      <!-- Global cmd+k hint -->
      <div class="fixed bottom-4 right-4 hidden md:flex items-center gap-2 bg-surface-alt border border-border px-3 py-2 rounded-full shadow-sm text-xs text-muted pointer-events-none z-10">
        <span>Command Palette</span>
        <kbd class="px-1.5 py-0.5 rounded bg-border font-mono text-muted-dark">⌘K</kbd>
      </div>
    </div>
    
    <!-- Using Vanilla JS instead of React -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
